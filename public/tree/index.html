 fill="#E2E8F0" xml:space="preserve">$loan = [</text><text class="mono" x="4065.95" y="2718.92" font-size="22" fill="#E2E8F0" xml:space="preserve">    'ticket'    =&gt; $ticket,</text><text class="mono" x="4065.95" y="2752.92" font-size="22" fill="#E2E8F0" xml:space="preserve">    'book'      =&gt; $invNo,</text><text class="mono" x="4065.95" y="2786.92" font-size="22" fill="#E2E8F0" xml:space="preserve">    'issued_at' =&gt; $today,</text><text class="mono" x="4065.95" y="2820.92" font-size="22" fill="#E2E8F0" xml:space="preserve">];</text><text class="mono" x="4065.95" y="2854.92" font-size="22" fill="#7DD3FC" xml:space="preserve">// 2. Сохранить запись в базу</text><text class="mono" x="4065.95" y="2888.92" font-size="22" fill="#E2E8F0" xml:space="preserve">$loanId = $db-&gt;insert('loans', $loan);</text><rect x="1769" y="3048" width="480" height="56" rx="10" fill="#fff" stroke="#D5DAE1" stroke-width="2"/><text class="mono" x="1793" y="3084.64" font-size="24" font-weight="500" fill="#1F2328">поставитьСрок(выдача, 14 дней)</text><rect x="2664.75" y="2979" width="474" height="194" rx="10" fill="#fff" stroke="#D5DAE1" stroke-width="2"/><text class="mono" x="2686.75" y="3010" font-size="23" font-weight="700" fill="#6B7280">поставитьСрок(выдача, 14 дней)</text><line x1="2664.75" x2="3138.75" y1="3023" y2="3023" stroke="#D5DAE1" stroke-width="2"/><text x="2686.75" y="3066.28" font-size="23" font-weight="700" fill="#6B7280">1.</text><text x="2720.75" y="3066.28" font-size="23" font-weight="500" fill="#1F2328">Взять сегодняшнюю дату</text><text x="2686.75" y="3106.28" font-size="23" font-weight="700" fill="#6B7280">2.</text><text x="2720.75" y="3106.28" font-size="23" font-weight="500" fill="#1F2328">Прибавить 14 дней</text><text x="2686.75" y="3146.28" font-size="23" font-weight="700" fill="#6B7280">3.</text><text x="2720.75" y="3146.28" font-size="23" font-weight="500" fill="#1F2328">Записать это как срок возврата</text><rect x="4035.95" y="2956" width="878.4" height="240" rx="10" fill="#1E2733"/><text class="mono" x="4065.95" y="2998.92" font-size="22" fill="#7DD3FC" xml:space="preserve">// 1. Взять сегодняшнюю дату</text><text class="mono" x="4065.95" y="3032.92" font-size="22" fill="#E2E8F0" xml:space="preserve">$today = new DateTime();</text><text class="mono" x="4065.95" y="3066.92" font-size="22" fill="#7DD3FC" xml:space="preserve">// 2. Прибавить 14 дней</text><text class="mono" x="4065.95" y="3100.92" font-size="22" fill="#E2E8F0" xml:space="preserve">$due = (clone $today)-&gt;modify('+14 days');</text><text class="mono" x="4065.95" y="3134.92" font-size="22" fill="#7DD3FC" xml:space="preserve">// 3. Записать это как срок возврата</text><text class="mono" x="4065.95" y="3168.92" font-size="22" fill="#E2E8F0" xml:space="preserve">$db-&gt;update('loans', ['due_date' =&gt; $due], ['id' =&gt; $loanId]);</text><rect x="458" y="3544.5" width="440" height="64" rx="10" fill="#fff" stroke="#3F5A7A" stroke-width="3"/><g transform="translate(480 3562.722222222222) scale(0.2222222222222222)"><g filter="url(#libshs)"><rect x="14.0" y="8.0" width="154.0" height="60.0" rx="3" fill="#FFFDF7" stroke="#2E3440" stroke-width="1.5"/><line x1="26.0" y1="20.0" x2="104.0" y2="20.0" stroke="#C9BBA3" stroke-width="1.5" stroke-linecap="round"/><rect x="24.0" y="-1.0" width="30.0" height="11.0" rx="2" fill="#F0E2CA" stroke="#2E3440" stroke-width="1.5"/><rect x="8.0" y="18.0" width="154.0" height="60.0" rx="3" fill="#FFFDF7" stroke="#2E3440" stroke-width="1.5"/><line x1="20.0" y1="30.0" x2="98.0" y2="30.0" stroke="#C9BBA3" stroke-width="1.5" stroke-linecap="round"/><rect x="65.0" y="9.0" width="30.0" height="11.0" rx="2" fill="#E8B9A9" stroke="#2E3440" stroke-width="1.5"/><rect x="18.0" y="28.0" width="154.0" height="60.0" rx="3" fill="#FFFDF7" stroke="#2E3440" stroke-width="1.5"/><line x1="30.0" y1="40.0" x2="108.0" y2="40.0" stroke="#C9BBA3" stroke-width="1.5" stroke-linecap="round"/><rect x="106.0" y="19.0" width="30.0" height="11.0" rx="2" fill="
